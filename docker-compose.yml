version: "3.8"

services:
  # ==================== 后端服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhinengti-backend
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      - DB_TYPE=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=zhinengti123
      - DB_NAME=zhinengti
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-this}
      - AMAP_API_KEY=${AMAP_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - zhinengti-network

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhinengti-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - zhinengti-network

  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: zhinengti-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=zhinengti123
      - MYSQL_DATABASE=zhinengti
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pzhinengti123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zhinengti-network

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: zhinengti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - zhinengti-network

  # ==================== Nginx（可选，用于生产）====================
  # nginx:
  #   image: nginx:alpine
  #   container_name: zhinengti-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - zhinengti-network

volumes:
  mysql-data:
  redis-data:
  backend-data:
  backend-logs:

networks:
  zhinengti-network:
    driver: bridge